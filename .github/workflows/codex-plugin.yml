name: Codex plugin
on:
  push:
    branches: [main]
    paths: ['plugins/krill-usage/**', 'src/model.js', 'src/jwt.js', '.agents/plugins/marketplace.json', '.github/workflows/codex-plugin.yml']
  pull_request:
    paths: ['plugins/krill-usage/**', 'src/model.js', 'src/jwt.js', '.agents/plugins/marketplace.json', '.github/workflows/codex-plugin.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-plugin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/krill-usage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/krill-usage/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: krill-usage-codex-${{ runner.os }}-${{ runner.arch }}
          path: |
            plugins/krill-usage/artifacts/*.tar.gz
            plugins/krill-usage/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
